<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ARIS</title>
    <link href="/style.css" rel="stylesheet">
</head>
<body>
<header>
    <span class="title">ARIS</span>
    <nav id="pageNav">
        <button data-page="config" class="active">設定</button>
        <button data-page="operation">操作</button>
    </nav>
</header>
<main>
    <div id="page-config" class="page active">
        <div id="mapWrap">
            <canvas id="map"></canvas>
        </div>
        <aside id="side">
            <div class="panel" id="panelTop">
                <div class="placeholder" id="panelTopPlaceholder">---</div>
                <div id="panelTopContent" style="display:none;"></div>
            </div>
            <div id="panelBottom">
                <div class="listBox" data-list="sections">
                    <div class="listHeader">
                        <span>区間</span>
                        <button class="btnAdd" data-list="sections">Add</button>
                        <button class="btnFolder" data-list="sections">Folder</button>
                    </div>
                    <div class="folderCreate" id="folderCreate-sections" style="display:none;">
                        <input type="text" class="folderNameInput" placeholder="フォルダ名">
                        <div class="folderCreateActions">
                            <button class="btnFolderCreate" data-list="sections">Create</button>
                        </div>
                    </div>
                    <ul id="sectionList" class="treeList"></ul>
                </div>
                <div class="listBox" data-list="routes">
                    <div class="listHeader">
                        <span>進路</span>
                        <button class="btnAdd" data-list="routes">Add</button>
                        <button class="btnFolder" data-list="routes">Folder</button>
                    </div>
                    <div class="folderCreate" id="folderCreate-routes" style="display:none;">
                        <input type="text" class="folderNameInput" placeholder="フォルダ名">
                        <div class="folderCreateActions">
                            <button class="btnFolderCreate" data-list="routes">Create</button>
                        </div>
                    </div>
                    <ul id="routeList" class="treeList"></ul>
                </div>
            </div>
        </aside>
    </div>
    <div id="page-operation" class="page">
        <div id="opMapWrap">
            <canvas id="opMap"></canvas>
        </div>
        <aside id="opSide">
            <div class="opListHeader">進路</div>
            <ul id="opRouteList" class="opRouteList"></ul>
        </aside>
    </div>
</main>
<script type="module" src="/js/main.js"></script>
</body>
</html>
